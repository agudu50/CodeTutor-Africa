[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codetutor-africa-backend"
version = "0.1.0"
description = "Offline-First AI Programming Tutor for Africa Deep Tech Challenge (ADTC) 2026 Laptop LLM Track"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CodeTutor Africa Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "alembic>=1.13.0",
]
llama = [
    "llama-cpp-python>=0.3.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["."]
